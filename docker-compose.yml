services:
  retrieve-lms-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - retrieve-network
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/
          initial_sync: true
        - action: rebuild
          path: backend/requirements.txt
        - action: rebuild
          path: .env

  retrieve-lms-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - retrieve-network
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app/
          initial_sync: true
        - action: rebuild
          path: fronend/requirements.txt
        - action: rebuild
          path: .env

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - retrieve-lms-backend
      - retrieve-lms-frontend
    networks:
      - retrieve-network

networks:
  retrieve-network:
    driver: bridge
